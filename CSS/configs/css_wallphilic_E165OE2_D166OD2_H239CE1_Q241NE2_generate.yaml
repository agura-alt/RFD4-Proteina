# @package _global_
#
# "Wall only hydrophilic" arm: 4-hotspot all-polar epitope, all four VHH frameworks,
# 1000 designs.
#
# NAME. "wall only hydrophilic" is the colloquial name and carries no semantics. The
# `css_wallphilic_` prefix keeps it distinct from the other 4-hotspot arm in this
# campaign (`css_groove_...`, a different hotspot set at the same count) and from
# `css_cdr123_..._high_...`, which is the high RECYCLING arm on a different axis
# entirely. Prefix plus hotspot set means no two arms collide in RUNS.md or in any
# aggregation keyed on run_name. See the arm's REPORT.md.
#
# REFERENCE CONFIG: css_6hot_E165OE2_D166OD2_L204CD2_L206CD2_Q241NE2_Y246CE1_generate.yaml
# -----------------------------------------------------------------------------------
# The most recent predecessor and the one that already settled the 1000-design scale
# settings: same four frameworks supplied as a directory, same medium/front_loaded
# recycling, same metrics, same pass criteria, same compress_outputs + gen_njobs,
# same num_replicates. Chosen over:
#   - css_groove_E165OE2_L204CD2_L206CD2_Q241NE2_generate.yaml -- equally valid (and the
#     6hot arm's own reference), but its header carries a stale contradiction: the
#     "Design count" section states compress_outputs and gen_njobs are NOT set while the
#     body sets both. Referencing the 6hot file avoids propagating that text.
#   - css_cdr123_L204CD2_L206CD2_Y246CE1_generate.yaml -- predates the scale settings;
#     referencing it would reintroduce deltas two arms have already settled.
#   - css_cdr123_..._high_generate.yaml -- high/front_loaded, 25 reps. A budget
#     escalation, not requested here; AGENTS.md says use the task's MEDIUM preset unless
#     another budget is asked for, and PPI medium front-loaded is the 120/180/300 schedule.
#   - css_vobarilizumab_1000_generate.yaml -- single framework. Wrong shape.
#
# DELTAS vs the reference, and nothing else:
#   1. inputs           -> the E165OE2_D166OD2_H239CE1_Q241NE2 CIF directory (4 files)
#   2. out_dir/run_name -> this arm's own tree
# compress_outputs, gen_njobs, num_replicates, batch_size, metrics_tags, every metric,
# pre_oracle_filters, refolding_oracles and all three pass criteria are byte-identical to
# the reference. The recycling preset is unchanged at medium/front_loaded (180 passes).
#
# VERIFIED by Hydra composition diff, 2026-11-21: 418 composed keys on each side,
# 4 differing. Three are the deltas above; the fourth is
# `generation.val_set_name_override`, which is derived from `inputs` and tracks it
# automatically -- not a hand edit. Nothing else in the composed tree moves.
#
# Design count
# ------------
# num_replicates is PER INPUT, and `inputs` is a directory of 4 CIFs, so this is
# 250 designs PER FRAMEWORK = 1000 total -- matching the groove and 6hot arms exactly,
# so all three multi-framework hotspot arms are comparable at equal depth. ASSUMPTION:
# 250 was adopted from the predecessors, not requested for this arm. `num_replicates`
# is the only lever that needs touching to rescale.
#
# hotspot_adherence stays at min: 1.0 -- it is 4-of-4 here
# --------------------------------------------------------
# `hotspot_obedience >= 1.0` means EVERY hotspot contacted (all-heavy-atom nearest
# neighbour at 4.5 A, from configs/metrics/inline_metrics/design_metrics.yaml). Four
# hotspots is a harder gate than the template arm's 3-of-3 and an easier one than the
# 6hot arm's 6-of-6, so the three are NOT gated comparably. Kept at 1.0 for the same
# reason the 6hot arm keeps it: the raw fraction is recorded on every design regardless,
# so a 3-of-4 (0.75) analysis is a filter over the output table after the fact, while
# changing the threshold here would make this the only arm whose gate differs.
# Score PER-HOTSPOT offline -- a pooled average hides WHICH atom a failing design dropped.
#
# What this arm actually tests, and the trap in reading it
# --------------------------------------------------------
# This is the most solvent-exposed epitope in the campaign. Burial proxy (heavy atoms
# within 8 A) is 26/44/43/48, against 77/83/66 for the template arm -- every atom here
# is shallow. Span and angular spread sit close to the 1G8 positive control:
#
#     arm                        hotspots   max span   angular spread   burial proxy
#     204/206/246 (template)        3        13.77 A      57.7 deg      77/83/66
#     165/204/206/241 (groove)      4         8.49 A      28.4 deg      26/77/83/48
#     all six (6hot)                6        19.35 A      66.8 deg      --
#     THIS ARM                      4        15.05 A      48.1 deg      26/44/43/48
#     1G8 control                   3        17.36 A      58.3 deg      44/48/61
#
# On reachability this should be the EASIEST arm to satisfy. But it drops LEU 204 and
# LEU 206, the only buried apolar anchors in any CSS arm, and GLU 165 + ASP 166 are both
# acidic, which pushes designs toward an Arg/Lys-rich paratope -- a classic specificity
# failure mode that often refolds with lower confidence even when the hotspot gate passes.
# EXPECT hotspot_adherence UP and min_ipae FLAT OR WORSE relative to the other arms, and
# do NOT read a high hotspot pass rate here as a better binder. The two gates are
# measuring different things on this arm more than on any other.
#
# HIS 239 is CE1, a ring CARBON (switched from NE2 on instruction, 2026-11-21). All four
# hotspot RESIDUES are hydrophilic, but this one ATOM is not, so the arm name describes
# three of its four contacts. CE1 is the residue's most exposed atom (26.93 A^2) and is
# immune to the ND1/NE2 refinement-assignment ambiguity. See REPORT.md flags 1 and 2.
#
# Before submitting
# -----------------
# `gen_njobs: 10` is honoured by scripts/launch_generate.sh, which sizes the SLURM array
# from the resolved config. It is NOT honoured by CSS/submit_generate.sh, which takes
# NJOBS from the environment (default 1) and passes it as an explicit gen_njobs= override
# that BEATS this file. With that launcher, set NJOBS=10 and --array=0-9 together.
#
# Verify composition before launching:
#   PROJECT_ROOT=$PWD python CSS/preflight_metric_selection.py \
#       css_wallphilic_E165OE2_D166OD2_H239CE1_Q241NE2_generate 180
#
defaults:
  - inference
  - /recycle_strategy@generation: medium/front_loaded
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

inputs: ${oc.env:PROJECT_ROOT}/CSS/inputs/cifs_E165OE2_D166OD2_H239CE1_Q241NE2
out_dir: ${oc.env:PROJECT_ROOT}/runs/css_wallphilic_E165OE2_D166OD2_H239CE1_Q241NE2
run_name: css_wallphilic_E165OE2_D166OD2_H239CE1_Q241NE2_generate

compress_outputs: true
gen_njobs: 10

num_replicates: 250
batch_size: 2

metrics_tags: [design, antibody, interchain_interactions,
               3d_coordinate_conditioning, internal_coordinate_conditioning,
               ppi_refolding, apo_refolding, nanobody_geometry,
               hotspot_conditioning]

metrics:
  refolding_metrics:
    refolded_backbone_rmsd:
      required_tags_all: ["is_refold:oracle_ppi"]
    refolded_target_aligned_binder_rmsd:
      align_mask: "(chain_id != 'H') & is_protein"
      subset_mask: "(chain_id == 'H') & is_protein"
      required_tags_all: ["is_refold:oracle_ppi"]
    refolded_target_backbone_aligned_binder_rmsd:
      align_mask: "(chain_id != 'H') & is_protein_backbone"
      subset_mask: "(chain_id == 'H') & is_protein"
      required_tags_all: ["is_refold:oracle_ppi"]
    refolded_apo_holo_rmsd:
      align_mask: "(chain_id == 'H') & is_protein_backbone"
      subset_mask: "(chain_id == 'H') & is_protein_backbone"
      input_kwarg_names:
        ground_truth_atom_array: refold.oracle_apo.apo
        predicted_atom_array: refold.oracle_ppi
      required_tags_all: ["is_refold:oracle_apo.apo", "exists_refold:oracle_ppi"]
    refolded_apo_holo_cdr_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: "(chain_id == 'H') & is_protein_backbone & sa_mask('C_SEQ')"
      subset_mask: "(chain_id == 'H') & is_protein_backbone & ~sa_mask('C_SEQ')"
      metric_type: rmsd
      aggregation: [median]
      input_kwarg_names:
        ground_truth_atom_array: refold.oracle_apo.apo
        predicted_atom_array: refold.oracle_ppi
      required_tags_all: ["is_refold:oracle_apo.apo", "exists_refold:oracle_ppi"]
  pre_oracle_filters: null
  refolding_oracles:
    oracle_ppi:
      frac_under_thresholds:
        min_ipae_coi: [1, 1.2, 1.5, 2]
  pass_criteria:
    min_ipae:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        oracle_ppi.min_ipae_coi:
          max: 1.2
      required_tags_any: [ppi_refolding]
    hotspot_adherence:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        hotspot_obedience.hotspot_obedience:
          min: 1.0
      required_tags_any: [hotspot_conditioning]
    apo_holo_consistency:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        refolded_apo_holo_rmsd.apo.rmsd:
          max: 2.0
        refolded_apo_holo_cdr_rmsd.apo.rmsd:
          max: 2.0
      required_tags_any: [apo_refolding]
