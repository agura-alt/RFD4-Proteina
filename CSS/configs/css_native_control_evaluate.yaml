# @package _global_
#
# Score the native 1G8 complex with this campaign's own metric definitions.
#
# The point is calibration, not design assessment. The campaign's gates have never been
# measured against a binder known to work on this antigen, so a failing design and an
# unreachable gate are indistinguishable. `CSS/build_native_control_annotated.py` builds the
# input; this file scores it through the same metrics the generate config uses.
#
# First result, from the UNANNOTATED control and the plain `oracle` (no template):
#   native min_ipae 16.56, iptm 0.13   vs the 12 designs' 15.8-24.5 and 0.07-0.17.
# A crystallographic binder landed inside the design distribution and failed the 1.2 gate by
# more than an order of magnitude. This run repeats that with conditioning in place, so
# `oracle_ppi` templates the target as it did for the designs, and extends it to
# `apo_holo_consistency` -- the one criterion the campaign added on independent grounds and
# the next ruler worth calibrating (designs: 4/12 passed).
#
# Pattern C layout, as in the generate config: this file lives outside `configs/`, inherits
# `evaluate`, and adds a hydra.searchpath so the `/metrics` groups resolve.

defaults:
  - evaluate
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

inputs: ${oc.env:PROJECT_ROOT}/CSS/inputs/native_control
out_dir: ${oc.env:PROJECT_ROOT}/runs/native_control_annotated
run_name_: css_native_control_evaluate

# Deliberately narrower than the generate config's tag list. Every inline metric that raises
# takes the entire refolding pipeline for that example down with it -- that is how the
# 2026-11-04 run lost `hotspot_obedience` to a ddG failure, and how this control lost all of
# its metrics to an unresolvable chain-of-interest. With one input there is no averaging to
# hide behind, so only the tags this calibration needs are set:
#
#   ppi_refolding   oracle_ppi + the three design-vs-refold metrics + min_ipae/ppi criteria
#   apo_refolding   oracle_apo + the apo/holo pair + apo_holo_consistency
#   hotspot_conditioning
#                   hotspot_obedience, which is worth having: the native binder reaches all
#                   three conditioned atoms at 3.02 / 3.55 / 3.61 A, inside the gate's 4.5 A,
#                   so this should report 1.0. If it raises, drop this tag and re-run -- the
#                   apo/holo calibration does not depend on it.
#
# `design`, `antibody` and the coordinate-conditioning tags are left off: they activate
# inline metrics written for generated outputs, and a control is not worth risking them for.
metrics_tags: [ppi_refolding, apo_refolding, hotspot_conditioning]

metrics:
  # Copied verbatim from css_cdr123_L204CD2_L206CD2_Y246CE1_generate.yaml so the control is
  # measured by the same rulers as the designs. The authored `sa_mask('C_CRD')` forms select
  # 0 atoms on a design output and emit no column; these address the binder as chain H
  # instead. Do not "fix" one copy without the other.
  refolding_metrics:
    refolded_backbone_rmsd:
      required_tags_all: ["is_refold:oracle_ppi"]
    refolded_target_aligned_binder_rmsd:
      align_mask: "(chain_id != 'H') & is_protein"
      subset_mask: "(chain_id == 'H') & is_protein"
      required_tags_all: ["is_refold:oracle_ppi"]
    refolded_target_backbone_aligned_binder_rmsd:
      align_mask: "(chain_id != 'H') & is_protein_backbone"
      subset_mask: "(chain_id == 'H') & is_protein"
      required_tags_all: ["is_refold:oracle_ppi"]
    refolded_apo_holo_rmsd:
      align_mask: "(chain_id == 'H') & is_protein_backbone"
      subset_mask: "(chain_id == 'H') & is_protein_backbone"
      input_kwarg_names:
        ground_truth_atom_array: refold.oracle_apo.apo
        predicted_atom_array: refold.oracle_ppi
      required_tags_all: ["is_refold:oracle_apo.apo", "exists_refold:oracle_ppi"]
    # Framework/CDR split comes from C_SEQ, which the builder sets on framework positions
    # only. On a design output C_SEQ may not survive -- the generate config flags that risk
    # and the 2026-11-18 smoke run confirmed the column does appear. Here it is written
    # directly into the input, so it is present by construction.
    refolded_apo_holo_cdr_rmsd:
      _target_: rfproteina.metrics.gt_structure_comparison.StructureComparisonMetric
      align_mask: "(chain_id == 'H') & is_protein_backbone & sa_mask('C_SEQ')"
      subset_mask: "(chain_id == 'H') & is_protein_backbone & ~sa_mask('C_SEQ')"
      metric_type: rmsd
      aggregation: [median]
      input_kwarg_names:
        ground_truth_atom_array: refold.oracle_apo.apo
        predicted_atom_array: refold.oracle_ppi
      required_tags_all: ["is_refold:oracle_apo.apo", "exists_refold:oracle_ppi"]

  pre_oracle_filters: null

  refolding_oracles:
    oracle_ppi:
      # The campaign's gate at 1.2 alongside the repo defaults, so the distribution stays
      # visible. With one input these are 0.0 or 1.0 -- the per-example column is the number
      # that matters.
      frac_under_thresholds:
        min_ipae_coi: [1, 1.2, 1.5, 2]

  pass_criteria:
    min_ipae:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        oracle_ppi.min_ipae_coi:
          max: 1.2
      required_tags_any: [ppi_refolding]

    hotspot_adherence:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        hotspot_obedience.hotspot_obedience:
          min: 1.0
      required_tags_any: [hotspot_conditioning]

    apo_holo_consistency:
      _target_: rfproteina.metrics.oracles.pass_criterion_metric.PassCriterionMetric
      metric_thresholds:
        refolded_apo_holo_rmsd.apo.rmsd:
          max: 2.0
        refolded_apo_holo_cdr_rmsd.apo.rmsd:
          max: 2.0
      required_tags_any: [apo_refolding]
